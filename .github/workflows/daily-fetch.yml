name: daily-fetch

on:
  schedule:
    # 每天 07:50（北京时间）= 23:50 UTC 前一天
    - cron: "50 23 * * *"
    # 每天 21:30（北京时间）= 13:30 UTC
    - cron: "30 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          pip install -r daily/requirements.txt
          python -m playwright install --with-deps chromium

      - name: 抓取净值并更新数据
        env:
          PYTHONIOENCODING: utf-8
          PW_CHANNEL: ""
        run: python daily/fetch_data.py

      - name: 提交数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data.js daily/stats.json
          if git diff --cached --quiet; then
            echo "无数据变化"
          else
            git commit -m "data: update $(date -u +'%Y-%m-%d')"
            git push
          fi
