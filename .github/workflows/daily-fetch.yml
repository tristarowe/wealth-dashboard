name: daily-fetch

on:
  # 三层触发，互为兜底（同一 concurrency group，不会并发；重复跑会因「无数据变化」快速结束）
  #   ① Gitee Go 准点触发（workflow_dispatch）——北京 07:00 / 22:00。实测已停用：
  #      2026-11-20 起 16 轮里只有 2 次 dispatch 且均为手动，Gitee 侧不再按点触发；
  #   ② GitHub 原生 cron 是实际主力。实测排队 35～45 分钟：早间挂号北京 07:00，
  #      实际抓取落点 07:35～07:45，收益长图与新品预告约 08:00 前到手（用户 2026-11-26 确认要此刻）；
  #      晚间挂号 21:50、落点 22:31～22:48，只更新数据、整轮不推微信（同日取消夜推）；
  #   ③ 手动 workflow_dispatch。
  # 2026-11-19 事故：移除 cron 后完全依赖 Gitee Go，Gitee Go 停摆导致 11-18 22:00、
  # 11-19 07:30 两轮全部漏跑，数据停在 11-18 15:58。故恢复 cron 兜底。
  # 2026-11-26 用户要求：早间轮次由 07:30 提前到 07:00；微信推送不再按钟点无条件发送，
  # 改为「本轮全部抓取步骤完成且确实提交了新数据」才推（见末尾 changed 门禁）。
  schedule:
    - cron: "0 23 * * *"    # UTC 23:00 = 北京次日 07:00 挂号，排队 35～45 分钟后抓取落点≈07:40（前一日汇总）
    - cron: "50 13 * * *"   # UTC 13:50 = 北京 21:50（当日净值，只更新数据不推微信）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # 2026-11-24 修复：原 daily-fetch / nav-ccb / nav-rotate 各组独立，并发写 data.js
  # 导致 rebase 冲突、新 fetchedAt 被丢弃（页面「数据更新」停在昨晚）。统一分组串行化。
  group: nav-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          pip install -r daily/requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update
          # poppler-utils 提供 pdftotext：新品说明书 PDF 解析的第二道兜底
          sudo apt-get install -y fonts-noto-cjk poppler-utils

      - name: 拉取云端交易
        env:
          PYTHONIOENCODING: utf-8
          # service_role 绕过 RLS 读取全量交易；未配置时自动回退 anon key（兼容 RLS 开启前）
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # 必须排在 T-1 攻坚之前：新买入的持仓要当天就进入攻坚清单，
        # 否则当天新增的品会漏抓 T-1（2026-11-19 建信嘉鑫7天第63期即因此停在 T-2）
        run: python daily/pull_cloud.py || true

      - name: 净值攻坚（NLC165：持仓优先 + 全库精确补漏 + 建信官网）
        env:
          PYTHONIOENCODING: utf-8
          NAV_NO_COMMIT: "1"
        # 先按交易记录的真实持仓清单抓 T-1；--all 复用同一份 NLC165 索引精确补非持仓产品
        # （只接受精确名称/ECD + 真实净值，跳过现金类 1.0 占位）。中国理财网兜底交给下方轮换步骤
        run: python daily/nav_holdings_t1.py --all --gap 0.15

      - name: 抓取净值并更新数据
        env:
          PYTHONIOENCODING: utf-8
          PW_CHANNEL: ""
        run: python daily/fetch_data.py

      - name: 刷新产品库建信系净值（建信 chart + 建行官网 NLC165 双源取较新）
        env:
          PYTHONIOENCODING: utf-8
        # 建信官网 chart 自身滞后约一个交易日（T 日上午只到 T-2），
        # 建行官网 NLC165 通常已有 T-1，故按「日期更晚者」补尾部点，见脚本头部口径说明
        run: python daily/nav_official.py

      - name: 刷新产品库农银/信银/兴银/民生净值（官网直连，第一批 2026-11-22 + 民生 2026-11-23）
        env:
          PYTHONIOENCODING: utf-8
        # 四家都不需要登录/签名，列表接口自带最新净值；多份额靠「历史重叠点精确一致」判定，
        # 命中不足即放弃（宁可滞后不串份额）。见 daily/nav_sites.py 头部口径说明
        run: python daily/nav_sites.py || true

      - name: 轮换补抓其他产品净值（持仓产品优先）
        env:
          PYTHONIOENCODING: utf-8
          NAV_NO_COMMIT: "1"
        run: python daily/nav_rotate.py --limit 10 --prefer empty || true

      - name: 补齐产品库风险等级
        env:
          PYTHONIOENCODING: utf-8
        run: python daily/backfill_risk.py || true

      - name: 抓取新品预告（建行官网公告 · 销售文件要素表）
        env:
          PYTHONIOENCODING: utf-8
        # 代销机构从销售文件要素表实测（A/B/F 级证据），未取到才留"待核实"
        run: python daily/fetch_newproducts.py --days 14 --limit 200 --gap 1.2 || true

      - name: 新品成立后自动并入产品库
        env:
          PYTHONIOENCODING: utf-8
        # 幂等：仅并入"成立日<=今天且登记编码未入库"的新品，并为占位产品补抓净值
        # 提交统一交给下方「提交数据」步骤，避免双重 push 竞态
        run: python daily/promote_newproducts.py --gap 1.2 --no-self-commit || true
        # 2026-11-24：--no-self-commit 参数已补齐（原脚本未定义，导致本步骤每次必失败）。

      - name: 同步产品库较新净值到持仓底稿（按登记编码，防双源不同步）
        env:
          PYTHONIOENCODING: utf-8
        # 抓取链路可能只更新 library.js（如 nav_rotate 轮换补抓），data.js 仍停在旧日；
        # 此处按 regCode 把 library 较新净值回填 data.js，保证前端去重后显示 T-1。
        run: python daily/sync_nav_data.py

      - name: 提交数据
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data.js assets/library.js assets/newproducts.js assets/transactions.js \
                  assets/risk_levels.js daily/risk_levels.json \
                  daily/stats.json daily/library.json daily/newproducts.json \
                  daily/nav_holdings_t1.py daily/nav_rotate.py
          if git diff --cached --quiet; then
            echo "无数据变化"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: update $(date -u +'%Y-%m-%d')"
            # 2026-11-24 修复：原 `git pull --rebase ... || true` 在并发冲突时会吞掉错误，
            # 随后 git push 因处于 rebase 中间态显示「Everything up-to-date」却没推上去，
            # 导致新抓取的 fetchedAt/净值被丢弃（页面时间戳停在昨晚）。
            # 改为带冲突解决的显式重试：数据文件冲突时保留本轮刚抓取的版本（--theirs 在 rebase 中即本轮提交）。
            ok=0
            for i in 1 2 3; do
              git fetch origin main
              if git rebase origin/main; then ok=1; break; fi
              # rebase 冲突：data.js/library.js 以本轮抓取结果为准，其余自动合并
              for f in assets/data.js assets/library.js daily/library.json daily/stats.json assets/newproducts.js daily/newproducts.json; do
                git checkout --theirs -- "$f" 2>/dev/null || true
                git add -- "$f" 2>/dev/null || true
              done
              if git -c core.editor=true rebase --continue; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true
              sleep 3
            done
            if [ "$ok" != 1 ]; then
              echo "::error::rebase 三次失败，数据未提交，请人工干预" >&2
              exit 1
            fi
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 生成看板长图
        # 只有本轮真的抓到并提交了新数据才生成长图/推送，避免源端未披露时空推打扰
        if: steps.commit.outputs.changed == 'true'
        env:
          PYTHONIOENCODING: utf-8
          PW_CHANNEL: ""
          # RLS 后匿名截图是空壳：shot.py 用这把密钥拉全量交易，只注入截图浏览器内存
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python daily/shot.py || true

      - name: 微信推送
        # 2026-11-26：推送唯一触发条件 = 全部抓取步骤跑完 + 确有新数据提交（不再按钟点无条件发）
        if: steps.commit.outputs.changed == 'true'
        env:
          PYTHONIOENCODING: utf-8
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python daily/notify.py
