name: nav-ccb

# 建信系净值小时补抓（官网 chart 免登录、不限频）
#
# 为什么需要这个任务（2026-11-22）
# --------------------------------
# 建信官网 chart 的 21/22 号点常在周末/节假日「下午」才补齐，而此前建信只在
# daily-fetch 的 08:00 / 21:50 两次全量刷新，白天出现新点就一直空等，产品库整库
# 停在 T-2（11-22 11:53 现场：104 只建信里 82 只仍停在 11-20）。
# 本任务每小时按「净值最落后优先」取 14 只走官网 chart + 建行官网 NLC165 双源补点，
# 约 8 轮覆盖全部 104 只，全天候追平；daily-fetch 的两次全量刷新仍是最终保障。
#
# 触发：cron 每小时 :37（避开 nav-rotate 的 :07，减少 push 撞车）+ 手动（limit 0 = 全量）
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "本轮刷新只数（0 = 全量，用于立即补齐）"
        default: "14"

permissions:
  contents: write

concurrency:
  # 2026-11-24 修复：与 daily-fetch / nav-rotate 统一分组，避免并发写 data.js 触发 rebase 冲突
  group: nav-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install requests pycryptodome pymupdf

      - name: 建信双源补抓（最落后优先）
        env:
          PYTHONIOENCODING: utf-8
        run: python daily/nav_official.py --lag --limit ${{ inputs.limit || '14' }}

      - name: 产品库较新净值回填持仓底稿
        env:
          PYTHONIOENCODING: utf-8
        # data.js 与 library.js 用不同 id，前端按 data.js 优先去重；
        # 不回填的话，页面上持仓的净值日期会比产品库慢一天
        run: python daily/sync_nav_data.py

      - name: 补提交（nav_official 已自行 commit 时此处为空操作）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/library.js daily/library.json assets/data.js
          if git diff --cached --quiet; then
            echo "无数据变化"
          else
            git commit -m "data: 建信小时级补抓 $(date -u +'%Y-%m-%d %H:%M')"
            # 2026-11-24 修复：并发冲突时不再 `|| true` 静默吞错（曾导致新数据/push 丢失）
            ok=0
            for i in 1 2 3; do
              git fetch origin main
              if git rebase origin/main; then ok=1; break; fi
              for f in assets/data.js assets/library.js daily/library.json; do
                git checkout --theirs -- "$f" 2>/dev/null || true
                git add -- "$f" 2>/dev/null || true
              done
              if git -c core.editor=true rebase --continue; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true
              sleep 3
            done
            if [ "$ok" != 1 ]; then
              echo "::error::rebase 三次失败，补抓数据未提交" >&2
              exit 1
            fi
            git push origin HEAD:main
          fi
