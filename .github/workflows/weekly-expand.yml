name: weekly-expand

on:
  schedule:
    # 每周日 03:00（北京时间）= 周六 19:00 UTC：抓新成立产品并入产品库
    - cron: "0 19 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-expand
  cancel-in-progress: false

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install requests pycryptodome pymupdf

      - name: 产品库扩容（抓新发产品 + 净值）
        env:
          PYTHONIOENCODING: utf-8
        run: python daily/build_library.py --limit 60 --nav-limit 25 --gap 0.8

      - name: 提交数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/library.js daily/library.json daily/library_candidates.json
          if git diff --cached --quiet; then
            echo "无新增产品"
            exit 0
          fi
          git commit -m "data: 每周扩容产品库 $(date -u +'%Y-%m-%d')"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && break || sleep 10
          done
