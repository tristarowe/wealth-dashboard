name: bugcheck-watchdog

# 2026-11-25：06:00 全站排查因本地 WorkBuddy 平台限流（429）整轮没跑，
# 用户完全收不到推送。看门狗不依赖本地环境，07:30 检查当天 05:50–07:30
# 是否有 bugcheck-report 的 workflow_dispatch；没有就用 Server酱 推送告警。
# 有正常报告则静默退出，不重复打扰。

on:
  schedule:
    - cron: "30 23 * * *"   # UTC 23:30 = 北京次日 07:30
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install requests

      - name: 检查今早排查推送是否送达
        env:
          PYTHONIOENCODING: utf-8
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python daily/bugcheck_watchdog.py
