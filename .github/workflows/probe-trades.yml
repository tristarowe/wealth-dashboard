name: probe-trades

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install requests
      - name: 统计云端交易字段完整性（不输出金额与产品名）
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0, "daily")
          from pull_cloud import supabase_trades
          rows = supabase_trades()
          print("行数", len(rows))
          if not rows:
              raise SystemExit(0)
          keys = sorted({k for r in rows for k in r})
          print("字段", keys)
          print("有 applyDate", sum(1 for r in rows if r.get("applyDate")))
          print("有 confirmDate", sum(1 for r in rows if r.get("confirmDate")))
          print("有 amount>0", sum(1 for r in rows if (r.get("amount") or 0) > 0))
          print("有 shares>0", sum(1 for r in rows if (r.get("shares") or 0) > 0))
          from collections import Counter
          print("type 分布", Counter(r.get("type") for r in rows).most_common())
          print("pid 前缀", Counter((r.get("pid") or "")[:2] for r in rows).most_common())
          print("pid 去重", len({r.get("pid") for r in rows}))
          for r in rows:
              print(" 行", r.get("id"), "| type", r.get("type"),
                    "| apply", r.get("applyDate"), "| confirm", r.get("confirmDate"),
                    "| 金额空", not (r.get("amount") or 0),
                    "| 份额空", not (r.get("shares") or 0),
                    "| pid前缀", (r.get("pid") or "")[:2])
          PY
